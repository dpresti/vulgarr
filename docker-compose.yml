services:
  vulgarr:
    # Pinned to a released version, not :latest -- deliberate upgrades (bump this,
    # `docker compose pull && up -d`) rather than silently picking up whatever the
    # most recent push to main happened to build. Built by .github/workflows/
    # docker-publish.yml on every vX.Y.Z tag push (see README's release process).
    image: ghcr.io/dpresti/vulgarr:2.2.0
    container_name: vulgarr
    restart: unless-stopped
    ports:
      - ${SPF_PORT:-8011}:8000
    environment:
      TZ: ${TZ}
      # Matches the host user that owns SPF_DATA_DIR/MEDIA_ROOT_HOST_PATH below, so
      # files this container creates aren't owned by some arbitrary build-time uid.
      # `id -u`/`id -g` on the host tells you what to set these to.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SPF_MEDIA_ROOT: ${SPF_MEDIA_ROOT:-/media}
      # Sonarr/Radarr/Bazarr URL+API key and the webhook token are only *seeded* from
      # these on first run -- after that they live in the database and are fully
      # editable from Settings in the UI without touching this file or restarting.
      SPF_SONARR_URL: http://sonarr:8989
      SPF_SONARR_API_KEY: ${SONARR_API_KEY}
      SPF_RADARR_URL: http://radarr:7878
      SPF_RADARR_API_KEY: ${RADARR_API_KEY}
      SPF_BAZARR_URL: http://bazarr:6767
      SPF_BAZARR_API_KEY: ${BAZARR_API_KEY}
      SPF_WEBHOOK_TOKEN: ${SPF_WEBHOOK_TOKEN}
      SPF_DEFAULT_SUBTITLE_LANGUAGE: en
    volumes:
      - ${SPF_DATA_DIR:-./data}:/data
      # Container-side mount point MUST match SPF_MEDIA_ROOT above exactly, and must be
      # the identical container-side path your Sonarr/Radarr containers use -- this app
      # resolves file paths returned by their APIs directly, so a mismatch here means it
      # won't find files that exist. Once titles are synced, changing this later breaks
      # every already-stored path -- pick it once, matching your existing Sonarr/Radarr
      # setup, and treat it as fixed after that.
      - ${MEDIA_ROOT_HOST_PATH}:${SPF_MEDIA_ROOT:-/media}
      # Optional: a second, separate media root, only needed if your library is split
      # across more than one mount that Sonarr/Radarr/Bazarr also mount independently
      # (this app has no config of its own for this -- it's purely a filesystem mount,
      # matched by container-side path just like the primary one above). Delete this
      # line entirely if you only have one media root.
      - ${SECOND_MEDIA_ROOT_HOST_PATH:-/dev/null}:${SECOND_MEDIA_ROOT_CONTAINER_PATH:-/second_media}
    networks:
      - media_default # join the sonarr/radarr/bazarr network so they're reachable by container name
networks:
  media_default:
    external: true
