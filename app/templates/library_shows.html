{% extends "base.html" %}
{% block content %}
  <div class="toolbar">
    <h1>TV Shows</h1>
  </div>

  <form method="get" action="/library/shows" style="margin: 0.75rem 0;">
    <input type="text" name="q" placeholder="Search shows…" value="{{ q }}" class="wide-input">
    <button type="submit">Search</button>
    {% if q %}<a href="/library/shows" class="btn-link small">Clear</a>{% endif %}
  </form>

  {% with shows=shows, next_url=next_url %}
    {% include "partials/poster_grid_shows.html" %}
  {% endwith %}
  <p class="muted">{{ show_total }} show(s)</p>
{% endblock %}
