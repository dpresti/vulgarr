{% extends "base.html" %}
{% block content %}
  <div class="toolbar">
    <h1>TV Shows</h1>
  </div>

  <form method="get" action="/library/shows" style="margin: 0.75rem 0;">
    <input type="text" name="q" placeholder="Search shows…" value="{{ q }}" style="min-width: 320px;">
    <button type="submit">Search</button>
    {% if q %}<a href="/library/shows" class="muted">clear</a>{% endif %}
  </form>

  {% include "partials/poster_grid_shows.html" %}
  {% with total=show_total, page=show_page, page_size=show_page_size, pager_link=show_pager_qs %}
    {% include "partials/pager.html" %}
  {% endwith %}
{% endblock %}
