{% extends "base.html" %}
{% block content %}
  <div class="toolbar">
    <h1>Movies</h1>
  </div>

  <form method="get" action="/library/movies" class="search-bar">
    <input type="text" name="q" placeholder="Search movies…" value="{{ q }}">
    <button type="submit">Search</button>
    {% if q %}<a href="/library/movies" class="btn-link small">Clear</a>{% endif %}
  </form>

  {% with rows=movie_rows, next_url=next_url %}
    {% include "partials/poster_grid.html" %}
  {% endwith %}
  <p class="muted">{{ movie_total }} title(s)</p>
  {% include "partials/pip_legend.html" %}
{% endblock %}
