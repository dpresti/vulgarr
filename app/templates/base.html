<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vulgarr</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.46.0/dist/tabler-icons.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root {
      color-scheme: dark;

      /* Brand */
      --vulgarr-accent: #E53935;
      --vulgarr-accent-hover: #D32F2F;
      --vulgarr-accent-glow: rgba(229, 57, 53, 0.25);

      /* Backgrounds */
      --vulgarr-bg-main: #141419;
      --vulgarr-bg-surface: #1E1F28;
      --vulgarr-bg-elevated: #2A2C38;
      --vulgarr-bg-row-hover: #1A1B23;
      --vulgarr-border: #353846;

      /* Typography */
      --vulgarr-text-primary: #FFFFFF;
      --vulgarr-text-secondary: #9E9EB2;
      --vulgarr-text-muted: #606275;

      /* Status (semantic -- deliberately distinct from the brand accent above,
         so "danger" badges never get mistaken for primary buttons/links) */
      --vulgarr-success-bg: #1F4D2D;
      --vulgarr-success-text: #7FE3A0;
      --vulgarr-warning-bg: #4D3D1F;
      --vulgarr-warning-text: #F0C674;
      --vulgarr-info-bg: #2C3550;
      --vulgarr-info-text: #9AB4F0;
      --vulgarr-danger-bg: #4D1F1F;
      --vulgarr-danger-text: #F08080;
      --vulgarr-danger-solid: #7A2C2C;
      --vulgarr-neutral-bg: #3A3A3A;
      --vulgarr-neutral-text: #B0B0B0;
      --vulgarr-outdated-bg: #4D3520;
      --vulgarr-outdated-text: #F0A25C;
      --vulgarr-nosub-bg: #4D4A1F;
      --vulgarr-nosub-text: #E8D44D;
    }
    body { font-family: system-ui, sans-serif; margin: 0; background: var(--vulgarr-bg-main); color: var(--vulgarr-text-primary); }
    .app-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; flex-shrink: 0; background: var(--vulgarr-bg-surface); border-right: 1px solid var(--vulgarr-border); padding: 1.25rem 0; position: relative; transition: width .15s ease; }
    .sidebar-brand { display: block; text-align: center; padding: 0 1rem 1.25rem; border-bottom: 1px solid var(--vulgarr-border); margin-bottom: 0.75rem; text-decoration: none; }
    .sidebar-brand svg { display: block; margin: 0 auto 8px; flex-shrink: 0; }
    .brand-wordmark { font-size: 1.3rem; font-weight: 900; color: var(--vulgarr-text-primary); letter-spacing: 0.02em; line-height: 1; white-space: nowrap; }
    .brand-wordmark span { color: var(--vulgarr-accent); }
    .brand-tagline { font-size: 0.6rem; font-weight: 600; color: var(--vulgarr-text-secondary); letter-spacing: 0.12em; margin-top: 6px; white-space: nowrap; }
    .sidebar nav { display: flex; flex-direction: column; gap: 2px; padding: 0 0.6rem; }
    .sidebar nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; color: var(--vulgarr-text-secondary); text-decoration: none; font-weight: 600; font-size: 0.9rem; white-space: nowrap; }
    .sidebar nav a i { font-size: 1.1rem; flex-shrink: 0; }
    .sidebar nav a:hover { color: var(--vulgarr-text-primary); }
    .sidebar nav a.active { background: var(--vulgarr-bg-elevated); color: var(--vulgarr-text-primary); }
    .sidebar nav .nav-sub-group { display: none; flex-direction: column; gap: 2px; }
    .sidebar nav .nav-sub-group.open { display: flex; }
    .sidebar nav .nav-sub { padding-left: 2.2rem; font-size: 0.85rem; font-weight: 500; }
    /* Direct Movies/TV Shows icons -- desktop already reaches them via the Library
       sub-nav above, so these only appear in the mobile icon bar (see media query). */
    .sidebar nav .nav-mobile-only { display: none; }
    .sidebar-toggle {
      position: absolute; top: 1.1rem; right: -13px; width: 26px; height: 26px; padding: 0;
      display: flex; align-items: center; justify-content: center; border-radius: 50%;
      background: var(--vulgarr-bg-elevated); border: 1px solid var(--vulgarr-border); color: var(--vulgarr-text-secondary);
      font-size: 0.85rem; z-index: 5;
    }
    .sidebar-toggle:hover { color: var(--vulgarr-text-primary); background: var(--vulgarr-border); }

    /* ---- collapsed (icon-only) sidebar, desktop ---- */
    html.sidebar-collapsed .sidebar { width: 64px; }
    html.sidebar-collapsed .sidebar-brand { padding: 0 0 1.25rem; }
    html.sidebar-collapsed .brand-wordmark, html.sidebar-collapsed .brand-tagline,
    html.sidebar-collapsed .nav-label, html.sidebar-collapsed .nav-sub-group { display: none; }
    html.sidebar-collapsed .sidebar nav a { justify-content: center; padding: 10px 0; }
    html.sidebar-collapsed .sidebar-toggle i { transform: rotate(180deg); }

    .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--vulgarr-text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.75rem; }
    .back-link:hover { color: var(--vulgarr-text-primary); }
    .back-link i { font-size: 1.1rem; }
    .btn-link {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      background: var(--vulgarr-bg-elevated); color: var(--vulgarr-text-primary);
      border: 1px solid var(--vulgarr-border); border-radius: 6px; padding: 0.4rem 0.8rem;
      font-weight: 600; font-size: 0.85rem;
    }
    .btn-link:hover { border-color: var(--vulgarr-accent); color: var(--vulgarr-accent); }
    .btn-link.small { padding: 0.2rem 0.6rem; font-size: 0.78rem; }
    .main-wrap { flex: 1; min-width: 0; }
    main { padding: 1.5rem; max-width: 1100px; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--vulgarr-border); vertical-align: middle; }
    th { color: var(--vulgarr-text-secondary); font-size: 0.85rem; text-transform: uppercase; }
    th a { color: inherit; text-decoration: none; }
    th a:hover { color: var(--vulgarr-accent); }
    .title-link { color: var(--vulgarr-text-primary); text-decoration: none; font-weight: 600; }
    .title-link:hover { color: var(--vulgarr-accent); }
    tbody tr:hover { background: var(--vulgarr-bg-row-hover); }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-done { background: var(--vulgarr-success-bg); color: var(--vulgarr-success-text); }
    .badge-processing { background: var(--vulgarr-warning-bg); color: var(--vulgarr-warning-text); }
    .badge-queued { background: var(--vulgarr-info-bg); color: var(--vulgarr-info-text); }
    .badge-failed { background: var(--vulgarr-danger-bg); color: var(--vulgarr-danger-text); }
    .badge-cancelled { background: var(--vulgarr-neutral-bg); color: var(--vulgarr-neutral-text); }
    .badge-awaiting_mkv { background: var(--vulgarr-info-bg); color: var(--vulgarr-info-text); }
    .badge-awaiting_subtitle { background: var(--vulgarr-info-bg); color: var(--vulgarr-info-text); }
    .badge-not_processed { background: var(--vulgarr-bg-elevated); color: var(--vulgarr-text-secondary); }
    .badge-outdated { background: var(--vulgarr-outdated-bg); color: var(--vulgarr-outdated-text); margin-left: 0.4rem; }
    .badge-no_subtitle { background: var(--vulgarr-nosub-bg); color: var(--vulgarr-nosub-text); }
    .badge-child { background: var(--vulgarr-info-bg); color: var(--vulgarr-info-text); }
    .badge-teen { background: var(--vulgarr-danger-bg); color: var(--vulgarr-danger-text); }
    progress { accent-color: var(--vulgarr-accent); background: var(--vulgarr-border); border-radius: 4px; height: 0.6rem; }
    button, input[type=submit] { background: var(--vulgarr-accent); color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    button:hover { background: var(--vulgarr-accent-hover); }
    button.secondary { background: var(--vulgarr-bg-elevated); }
    button.secondary:hover { background: var(--vulgarr-border); }
    button.danger { background: var(--vulgarr-danger-solid); }
    button.small { padding: 0.2rem 0.6rem; font-size: 0.78rem; font-weight: 500; }
    input[type=text], input[type=time], input[type=number], select { background: var(--vulgarr-bg-surface); border: 1px solid var(--vulgarr-border); color: var(--vulgarr-text-primary); padding: 0.4rem; border-radius: 6px; }
    input:focus, select:focus, button:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--vulgarr-accent-glow); }
    form.inline { display: inline-flex; gap: 0.4rem; align-items: center; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    .muted { color: var(--vulgarr-text-secondary); font-size: 0.85rem; }
    .settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 0.75rem 1.5rem; align-items: center; max-width: 640px; }
    .wide-input { min-width: 320px; }
    .input-md { width: 200px; }
    .input-sm { width: 100px; }
    .secret-field { position: relative; display: inline-block; }
    .secret-field input { padding-right: 2.3rem; }
    .secret-field .eye-toggle {
      position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--vulgarr-text-secondary);
      padding: 4px 6px; font-size: 1rem; cursor: pointer;
    }
    .secret-field .eye-toggle:hover { color: var(--vulgarr-text-primary); background: none; }
    .severity-checks { display: inline-flex; gap: 0.75rem; }
    .severity-checks label { font-size: 0.85rem; color: var(--vulgarr-text-secondary); white-space: nowrap; }
    .row-actions { display: flex; align-items: center; gap: 0.5rem; }
    details { margin-top: 1.5rem; }
    details:first-of-type { margin-top: 0; }
    summary { cursor: pointer; padding: 0.4rem 0; }
    summary:hover h2 { color: var(--vulgarr-accent); }
    summary h2 { transition: color 0.1s; }
    .topbar-job {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 1.5rem; background: var(--vulgarr-bg-elevated); border-bottom: 1px solid var(--vulgarr-border);
      font-size: 0.82rem;
    }
    .topbar-job-title { font-weight: 600; white-space: nowrap; }
    .topbar-job progress { width: 120px; }
    .topbar-job-pct { color: var(--vulgarr-text-secondary); width: 2.5em; }
    .topbar-job-msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---- poster grid (Library / Movies / TV Shows) ---- */
    .poster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 1.35rem 1.1rem; margin-top: 1.25rem; }
    .poster-card { display: block; text-decoration: none; color: inherit; }
    .load-more-sentinel { grid-column: 1 / -1; display: flex; justify-content: center; align-items: center; min-height: 48px; padding: 1rem 0; }
    .poster-frame {
      position: relative; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden;
      background: var(--vulgarr-bg-elevated); border: 1px solid var(--vulgarr-border);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .poster-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .poster-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 800; color: var(--vulgarr-text-muted); }
    .poster-card:hover .poster-frame { transform: translateY(-4px); border-color: var(--vulgarr-accent); box-shadow: 0 10px 26px rgba(0,0,0,.5), 0 0 0 1px var(--vulgarr-accent-glow); }
    .status-pip { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(20,20,25,.85); }
    .pip-done { background: var(--vulgarr-success-text); }
    .pip-processing { background: var(--vulgarr-warning-text); }
    .pip-queued { background: var(--vulgarr-info-text); }
    .pip-failed { background: var(--vulgarr-danger-text); }
    .pip-not_processed { background: var(--vulgarr-text-muted); }
    .pip-outdated { background: var(--vulgarr-outdated-text); }
    .pip-no_subtitle { background: var(--vulgarr-nosub-text); }
    .type-pip { position: absolute; top: 7px; left: 7px; font-size: 0.6rem; font-weight: 800; letter-spacing: .03em; color: var(--vulgarr-text-primary); background: rgba(20,20,25,.72); padding: 1px 5px; border-radius: 4px; }
    .poster-scrim {
      position: absolute; inset: auto 0 0 0; padding: 0.5rem 0.5rem 0.4rem;
      background: linear-gradient(to top, rgba(10,10,14,.94) 0%, rgba(10,10,14,.6) 60%, transparent 100%);
      opacity: 0; transform: translateY(4px); transition: opacity .16s ease, transform .16s ease;
    }
    .poster-card:hover .poster-scrim { opacity: 1; transform: translateY(0); }
    .meta-line { font-size: 0.7rem; color: var(--vulgarr-text-secondary); font-weight: 600; }
    .poster-title { margin-top: 0.5rem; font-size: 0.83rem; font-weight: 600; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .poster-progress { margin-top: 0.4rem; height: 4px; border-radius: 2px; background: var(--vulgarr-border); overflow: hidden; }
    .poster-progress-fill { height: 100%; background: var(--vulgarr-accent); }
    .legend { display: flex; gap: 1.1rem; flex-wrap: wrap; margin-top: 1.25rem; font-size: 0.78rem; color: var(--vulgarr-text-secondary); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

    /* ---- title detail page ---- */
    .detail-backdrop { position: relative; border-radius: 12px; overflow: hidden; background: var(--vulgarr-bg-surface); border: 1px solid var(--vulgarr-border); }
    .detail-backdrop-img { position: absolute; inset: 0; background-size: cover; background-position: center 20%; filter: blur(18px) brightness(0.4) saturate(1.1); transform: scale(1.15); }
    .detail-backdrop-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,20,25,.35) 0%, var(--vulgarr-bg-surface) 92%); }
    .detail-header { position: relative; display: flex; gap: 1.5rem; padding: 1.75rem; align-items: flex-end; flex-wrap: wrap; }
    .detail-poster { width: 140px; aspect-ratio: 2/3; border-radius: 8px; object-fit: cover; box-shadow: 0 12px 30px rgba(0,0,0,.5); border: 1px solid var(--vulgarr-border); flex-shrink: 0; }
    .detail-heading h1 { margin: 0 0 0.5rem; font-size: 1.6rem; text-wrap: balance; }
    .detail-badges { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .detail-body { position: relative; padding: 1.5rem 1.75rem 1.75rem; }
    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 720px; }
    .detail-section { margin-bottom: 1.4rem; }
    .detail-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--vulgarr-text-secondary); font-weight: 700; margin-bottom: 0.5rem; }
    .detail-stat { font-size: 0.92rem; }
    .detail-actions { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 1.5rem; align-items: center; }
    .saved-flash { font-size: 0.78rem; color: var(--vulgarr-success-text); font-weight: 600; margin-left: 0.6rem; }
    .detail-warning { margin-top: 0.7rem; padding: 0.6rem 0.8rem; border-radius: 6px; background: var(--vulgarr-outdated-bg); color: var(--vulgarr-outdated-text); font-size: 0.82rem; display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; }
    .detail-waiting { font-size: 0.82rem; color: var(--vulgarr-text-secondary); display: flex; align-items: center; gap: 6px; }
    .spinner { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--vulgarr-border); border-top-color: var(--vulgarr-accent); animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      .poster-grid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 1rem 0.7rem; }
      .detail-grid { grid-template-columns: 1fr; }
      .detail-header { padding: 1.25rem; }
      .detail-poster { width: 100px; }

      /* ---- mobile: sidebar becomes an icon-only top bar ---- */
      .app-layout { flex-direction: column; }
      .sidebar {
        width: auto !important; flex-shrink: 0; display: flex; align-items: center;
        padding: 0.5rem 0.6rem; border-right: none; border-bottom: 1px solid var(--vulgarr-border);
        position: sticky; top: 0; z-index: 20; overflow: hidden;
      }
      .sidebar-brand { display: flex; align-items: center; padding: 0; border-bottom: none; margin-bottom: 0; margin-right: 0.3rem; flex-shrink: 0; }
      .sidebar-brand svg { width: 32px; height: 32px; margin: 0; }
      .sidebar-brand .brand-wordmark, .sidebar-brand .brand-tagline { display: none; }
      .sidebar-toggle { display: none; }
      .sidebar nav {
        flex-direction: row; padding: 0; gap: 0; flex: 1; min-width: 0;
        overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        justify-content: space-between;
      }
      .sidebar nav::-webkit-scrollbar { display: none; }
      .sidebar nav .nav-group { display: contents; }
      .sidebar nav a { padding: 12px 10px; flex-shrink: 0; min-width: 44px; min-height: 44px; justify-content: center; }
      .sidebar nav a i { font-size: 1.5rem; }
      .sidebar nav .nav-label, .sidebar nav .nav-sub-group { display: none; }
      /* .nav-sub-group.open (2 base rules up) is more specific than the plain
         .nav-sub-group hide above, so it wins the cascade and pops the text
         sub-menu open on top of the icon bar whenever a /library/* route is
         active -- this repeats that exact selector to override it back off. */
      .sidebar nav .nav-sub-group.open { display: none; }
      .sidebar nav .nav-mobile-only { display: flex; }
      main { padding: 1rem; }

      /* ---- mobile: a fixed min-width is exactly the kind of thing that forces
         the page wider than the viewport (blank scrollable space to the right of
         everything) -- no responsive rule can shrink an inline style, so this
         only works because those are all a real .wide-input/.input-* class now. */
      .wide-input, .input-md, .input-sm { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }

      /* ---- mobile: stack label/input pairs instead of a fixed 320px column ---- */
      .settings-grid { grid-template-columns: 1fr; max-width: 100%; }
      .settings-grid > label { margin-top: 0.5rem; }
      .settings-grid input[type=text], .settings-grid input[type=password], .settings-grid input[type=number],
      .settings-grid .secret-field {
        width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box;
      }
      .settings-grid .secret-field input { width: 100%; box-sizing: border-box; }

      /* ---- mobile: page headers and the queue topbar wrap instead of overflowing ---- */
      .toolbar { flex-wrap: wrap; gap: 0.5rem; }
      .topbar-job { flex-wrap: wrap; padding: 0.5rem 1rem; row-gap: 0.3rem; }
      .topbar-job-title { white-space: normal; max-width: 100%; }
      .topbar-job-msg { flex-basis: 100%; white-space: normal; }

      /* ---- mobile: forms with several fields in a row (add/filter/inline-edit
         forms) wrap instead of forcing the page to scroll sideways ---- */
      form.inline { flex-wrap: wrap; row-gap: 0.4rem; }

      /* ---- mobile: data tables become stacked cards instead of a table that
         only works by scrolling sideways -- each <td> keeps its column header
         as a label via data-label, driven by CSS content, no JS needed. ---- */
      .responsive-table table { border-collapse: separate; border-spacing: 0; margin-top: 0.75rem; }
      .responsive-table thead { display: none; }
      .responsive-table tbody, .responsive-table tr, .responsive-table td { display: block; width: 100%; }
      .responsive-table tr {
        border: 1px solid var(--vulgarr-border); border-radius: 8px;
        margin-bottom: 0.75rem; padding: 0.6rem 0.8rem; background: var(--vulgarr-bg-surface);
      }
      .responsive-table td { border: none; padding: 0.35rem 0; text-align: left; }
      .responsive-table td::before {
        content: attr(data-label); display: block; font-weight: 700; font-size: 0.68rem;
        text-transform: uppercase; letter-spacing: 0.03em; color: var(--vulgarr-text-secondary);
        margin-bottom: 0.2rem;
      }
      .responsive-table td[data-label=""]::before { display: none; }
    }

    /* A second, tighter tier for the smallest phones (e.g. iPhone SE-class,
       ~320-374px) -- the six nav icons at the normal mobile size are right at
       the edge of fitting without a sideways scroll there. */
    @media (max-width: 380px) {
      .sidebar nav a { padding: 10px 7px; min-width: 38px; }
      .sidebar nav a i { font-size: 1.3rem; }
      .sidebar-brand svg { width: 28px; height: 28px; }
    }
  </style>
  <script>
    // Applied before the body paints so the sidebar never flashes expanded-then-collapsed.
    if (localStorage.getItem("vulgarr_sidebar_collapsed") === "1") {
      document.documentElement.classList.add("sidebar-collapsed");
    }
  </script>
  <script>
    // Severity checkboxes are cumulative: teen implies child.
    // Checking a box also checks everything below it; unchecking a box also
    // unchecks everything above it.
    const SEVERITY_ORDER = ["child", "teen"];
    function cascadeSeverity(changed) {
      const form = changed.form;
      const idx = SEVERITY_ORDER.indexOf(changed.name.replace("sev_", ""));
      const boxes = SEVERITY_ORDER.map((s) => form.querySelector(`[name="sev_${s}"]`));
      if (changed.checked) {
        for (let i = 0; i <= idx; i++) if (boxes[i]) boxes[i].checked = true;
      } else {
        for (let i = idx; i < boxes.length; i++) if (boxes[i]) boxes[i].checked = false;
      }
    }

    // Sonarr-style masked-by-default secret fields (API keys, webhook token) with a
    // click-to-reveal eye icon, instead of showing them in plaintext by default.
    function toggleSecretVisibility(button) {
      const input = button.previousElementSibling;
      const icon = button.querySelector("i");
      const revealed = input.type === "text";
      input.type = revealed ? "password" : "text";
      icon.className = revealed ? "ti ti-eye" : "ti ti-eye-off";
    }
  </script>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <button type="button" class="sidebar-toggle" id="sidebarToggle" title="Collapse sidebar" aria-label="Toggle sidebar">
        <i class="ti ti-chevron-left" aria-hidden="true"></i>
      </button>
      <a class="sidebar-brand" href="/library">
        <svg viewBox="0 0 512 512" width="52" height="52">
          <defs>
            <linearGradient id="navRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#FF5252" />
              <stop offset="100%" stop-color="#D32F2F" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="512" height="512" rx="110" fill="#242533" stroke="#353846" stroke-width="12"/>
          <path d="M 256,100 C 170,100 135,160 135,235 C 135,275 155,305 180,325 L 180,380 C 180,395 195,405 210,405 L 302,405 C 317,405 332,395 332,380 L 332,325 C 357,305 377,275 377,235 C 377,160 342,100 256,100 Z" fill="#FFFFFF"/>
          <ellipse cx="205" cy="225" rx="26" ry="32" fill="#1E1F28" transform="rotate(-6 205 225)"/>
          <path d="M 148,165 L 364,285" stroke="#E53935" stroke-width="9"/>
          <ellipse cx="307" cy="225" rx="30" ry="34" fill="#141419" stroke="#E53935" stroke-width="8"/>
          <rect x="65" y="300" width="382" height="80" rx="14" fill="url(#navRedGrad)"/>
          <text x="96" y="358" fill="#FFF" font-family="monospace" font-weight="900" font-size="46" letter-spacing="12">#$!%*</text>
        </svg>
        <div class="brand-wordmark">VULG<span>ARR</span></div>
        <div class="brand-tagline">PROFANITY FILTER</div>
      </a>
      <nav>
        <div class="nav-group">
          <a href="/library" title="Library" class="{{ 'active' if request.url.path == '/library' else '' }}"><i class="ti ti-layout-grid" aria-hidden="true"></i><span class="nav-label">Library</span></a>
          <div class="nav-sub-group {{ 'open' if request.url.path.startswith('/library') else '' }}">
            <a href="/library/movies" class="nav-sub {{ 'active' if request.url.path.startswith('/library/movies') else '' }}">Movies</a>
            <a href="/library/shows" class="nav-sub {{ 'active' if request.url.path.startswith('/library/shows') else '' }}">TV shows</a>
          </div>
        </div>
        <a href="/library/movies" title="Movies" class="nav-mobile-only {{ 'active' if request.url.path.startswith('/library/movies') else '' }}"><i class="ti ti-movie" aria-hidden="true"></i><span class="nav-label">Movies</span></a>
        <a href="/library/shows" title="TV Shows" class="nav-mobile-only {{ 'active' if request.url.path.startswith('/library/shows') else '' }}"><i class="ti ti-device-tv" aria-hidden="true"></i><span class="nav-label">TV Shows</span></a>
        <a href="/wordlist" title="Word list" class="{{ 'active' if request.url.path.startswith('/wordlist') else '' }}"><i class="ti ti-list" aria-hidden="true"></i><span class="nav-label">Word list</span></a>
        <a href="/queue" title="Activity" class="{{ 'active' if request.url.path.startswith('/queue') else '' }}"><i class="ti ti-activity" aria-hidden="true"></i><span class="nav-label">Activity</span></a>
        <a href="/settings" title="Settings" class="{{ 'active' if request.url.path.startswith('/settings') else '' }}"><i class="ti ti-settings" aria-hidden="true"></i><span class="nav-label">Settings</span></a>
      </nav>
    </aside>
    <div class="main-wrap">
      <div id="topbar" hx-get="/queue/topbar" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>
      <main>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script>
    const sidebarToggle = document.getElementById("sidebarToggle");
    sidebarToggle.addEventListener("click", () => {
      const collapsed = document.documentElement.classList.toggle("sidebar-collapsed");
      localStorage.setItem("vulgarr_sidebar_collapsed", collapsed ? "1" : "0");
      sidebarToggle.title = collapsed ? "Expand sidebar" : "Collapse sidebar";
    });
    if (document.documentElement.classList.contains("sidebar-collapsed")) {
      sidebarToggle.title = "Expand sidebar";
    }
  </script>
</body>
</html>
