<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subtitle Profanity Filter</title>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <style>
    :root { color-scheme: dark; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #14161a; color: #e6e6e6; }
    nav { display: flex; gap: 1.5rem; padding: 1rem 1.5rem; background: #1c1f26; border-bottom: 1px solid #2c303a; }
    nav a { color: #e6e6e6; text-decoration: none; font-weight: 600; }
    nav a:hover { color: #7cb7ff; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.45rem 0.75rem; border-bottom: 1px solid #2c303a; vertical-align: middle; }
    th { color: #9aa0aa; font-size: 0.85rem; text-transform: uppercase; }
    th a { color: inherit; text-decoration: none; }
    th a:hover { color: #7cb7ff; }
    tbody tr:hover { background: #191c22; }
    .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-done { background: #1f4d2d; color: #7fe3a0; }
    .badge-processing { background: #4d3d1f; color: #f0c674; }
    .badge-queued { background: #2c3550; color: #9ab4f0; }
    .badge-failed { background: #4d1f1f; color: #f08080; }
    .badge-cancelled { background: #3a3a3a; color: #b0b0b0; }
    .badge-awaiting_mkv { background: #2c3550; color: #9ab4f0; }
    .badge-awaiting_subtitle { background: #2c3550; color: #9ab4f0; }
    .badge-not_processed { background: #2c303a; color: #9aa0aa; }
    .badge-outdated { background: #4d3520; color: #f0a25c; margin-left: 0.4rem; }
    .badge-mild { background: #2c3550; color: #9ab4f0; }
    .badge-moderate { background: #4d3d1f; color: #f0c674; }
    .badge-strong { background: #4d1f1f; color: #f08080; }
    progress { accent-color: #2c5cc9; background: #2c303a; border-radius: 4px; height: 0.6rem; }
    button, input[type=submit] { background: #2c5cc9; color: white; border: none; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    button:hover { background: #3b6ee0; }
    button.secondary { background: #2c303a; }
    button.secondary:hover { background: #383d49; }
    button.danger { background: #7a2c2c; }
    button.small { padding: 0.2rem 0.6rem; font-size: 0.78rem; font-weight: 500; }
    input[type=text], input[type=time], input[type=number], select { background: #1c1f26; border: 1px solid #2c303a; color: #e6e6e6; padding: 0.4rem; border-radius: 6px; }
    form.inline { display: inline-flex; gap: 0.4rem; align-items: center; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; }
    .muted { color: #9aa0aa; font-size: 0.85rem; }
    .settings-grid { display: grid; grid-template-columns: 320px 1fr; gap: 0.75rem 1.5rem; align-items: center; max-width: 640px; }
    .severity-checks { display: inline-flex; gap: 0.75rem; }
    .severity-checks label { font-size: 0.85rem; color: #9aa0aa; white-space: nowrap; }
    .row-actions { display: flex; align-items: center; gap: 0.5rem; }
    details { margin-top: 1.5rem; }
    details:first-of-type { margin-top: 0; }
    summary { cursor: pointer; padding: 0.4rem 0; }
    summary:hover h2 { color: #7cb7ff; }
    summary h2 { transition: color 0.1s; }
    .topbar-job {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 1.5rem; background: #20242c; border-bottom: 1px solid #2c303a;
      font-size: 0.82rem;
    }
    .topbar-job-title { font-weight: 600; white-space: nowrap; }
    .topbar-job progress { width: 120px; }
    .topbar-job-pct { color: #9aa0aa; width: 2.5em; }
    .topbar-job-msg { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
  <script>
    // Severity checkboxes are cumulative: strong implies moderate implies mild.
    // Checking a box also checks everything below it; unchecking a box also
    // unchecks everything above it.
    const SEVERITY_ORDER = ["mild", "moderate", "strong"];
    function cascadeSeverity(changed) {
      const form = changed.form;
      const idx = SEVERITY_ORDER.indexOf(changed.name.replace("sev_", ""));
      const boxes = SEVERITY_ORDER.map((s) => form.querySelector(`[name="sev_${s}"]`));
      if (changed.checked) {
        for (let i = 0; i <= idx; i++) if (boxes[i]) boxes[i].checked = true;
      } else {
        for (let i = idx; i < boxes.length; i++) if (boxes[i]) boxes[i].checked = false;
      }
    }

    // Remember collapsed/expanded <details> sections across page loads (e.g. clicking
    // a sort link is a full navigation, which would otherwise reset every section back
    // to its default-open state).
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("details[data-persist]").forEach((el) => {
        const key = "spf-details-" + el.dataset.persist;
        const stored = localStorage.getItem(key);
        if (stored === "false") el.open = false;
        else if (stored === "true") el.open = true;
        el.addEventListener("toggle", () => localStorage.setItem(key, el.open));
      });
    });
  </script>
</head>
<body>
  <nav>
    <a href="/library">Library</a>
    <a href="/wordlist">Word List</a>
    <a href="/queue">Queue</a>
    <a href="/settings">Settings</a>
  </nav>
  <div id="topbar" hx-get="/queue/topbar" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
