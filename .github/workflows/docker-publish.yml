name: Publish Docker image

# Builds and pushes to GHCR under this repo's own namespace (ghcr.io/<owner>/<repo>)
# using the automatically-provided GITHUB_TOKEN -- no manual registry secret to
# create or rotate. First successful run creates the package as *private* by
# default; make it public once from the package's own Settings page on GitHub
# (Packages tab) if you want anonymous `docker pull` / the badges below to work.
on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
